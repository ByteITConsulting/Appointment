name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  pages: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build and Export Site
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
        run: npm run build
         
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out # Static directory generated by output: 'export'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
